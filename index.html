<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cynthia Informática | Estética Stradivarius</title>
    <style>
        /* Reset y Estilos Inspirados en Stradivarius */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Neue-Helvetica', Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            letter-spacing: 0.8px;
            -webkit-font-smoothing: antialiased;
        }

        a {
            color: #000000;
            text-decoration: none;
        }

        /* Banner Superior Fino */
        .top-banner {
            background-color: #000000;
            color: #ffffff;
            text-align: center;
            padding: 7px 15px;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* Encabezado Principal */
        header {
            position: sticky;
            top: 0;
            background-color: #ffffff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 50px;
            border-bottom: 1px solid #f2f2f2;
            z-index: 1000;
        }

        .brand-logo {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav a {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1.5px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #767676;
        }

        /* Hero / Portada Estilo Editorial Moda */
        .hero-section {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            background-color: #fafafa;
            border-bottom: 1px solid #f2f2f2;
        }

        .hero-section h1 {
            font-size: 42px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-bottom: 12px;
        }

        .hero-section p {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2.5px;
            color: #555555;
            margin-bottom: 35px;
        }

        .btn-stradi {
            border: 1px solid #000000;
            background-color: #000000;
            color: #ffffff;
            padding: 14px 40px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-stradi:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Catálogo de Proyectos / Lookbook Grid */
        .main-container {
            max-width: 1280px;
            margin: 70px auto;
            padding: 0 30px;
        }

        .section-header {
            text-align: center;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 3.5px;
            margin-bottom: 50px;
            font-weight: 700;
        }

        .grid-lookbook {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .lookbook-item {
            border: 1px solid #e5e5e5;
            padding: 35px 25px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: border-color 0.3s ease;
        }

        .lookbook-item:hover {
            border-color: #000000;
        }

        .lookbook-item h3 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .lookbook-item p {
            font-size: 12px;
            line-height: 1.7;
            color: #666666;
            letter-spacing: 0.3px;
        }

        /* Sección de Vídeo Integrado */
        .video-container-section {
            text-align: center;
            margin: 90px 0 50px 0;
            padding-top: 50px;
            border-top: 1px solid #eaeaea;
        }

        .video-embed-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 850px;
            margin: 30px auto 0 auto;
            border: 1px solid #e5e5e5;
        }

        .video-embed-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* Enlace a la tienda */
        .stradivarius-direct-link {
            text-align: center;
            margin: 60px 0;
            padding: 40px;
            background-color: #fcfcfc;
            border: 1px solid #ededed;
        }

        .btn-outline {
            display: inline-block;
            margin-top: 15px;
            border: 1px solid #000000;
            background: transparent;
            color: #000000;
            padding: 12px 30px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-outline:hover {
            background: #000000;
            color: #ffffff;
        }

        /* Pie de página */
        footer {
            border-top: 1px solid #eaeaea;
            padding: 40px 20px;
            text-align: center;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888888;
        }

        /* Responsive Móvil */
        @media (max-width: 900px) {
            .grid-lookbook {
                grid-template-columns: 1fr;
            }
            
            header {
                flex-direction: column;
                gap: 15px;
                padding: 20px;
            }

            .hero-section h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

    <div class="top-banner">
